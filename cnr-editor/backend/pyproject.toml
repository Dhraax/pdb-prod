[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "control-panel"
version = "0.1.0"
description = "Authenticated, reusable control panel for connected systems"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=25.1,<26",
    "cryptography>=45,<47",
    "fastapi>=0.139,<1",
    "pydantic-settings>=2.10,<3",
    "pymysql>=1.1,<2",
    "pyotp>=2.9,<3",
    "pwdlib>=0.3,<1",
    "segno>=1.6,<2",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[project.scripts]
control-panel-bootstrap-admin = "app.bootstrap_admin:main"
cnr-editor-bootstrap-admin = "app.bootstrap_admin:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "B008",   # FastAPI dependency injection intentionally uses Depends defaults.
    "EXE002", # DrvFS exposes workspace files as executable inside WSL containers.
]

[tool.ruff.lint.per-file-ignores]
"app/security.py" = ["BLE001"] # A malformed stored hash must fail closed.

[tool.pytest.ini_options]
testpaths = ["tests"]

name: server

# The host runs this file as it is, from its server directory: every relative
# path below resolves against the directory holding this file, not against the
# shell's working directory, so `docker compose -f <dir>/docker-compose.yml`
# mounts the right tree from anywhere.

services:
  pb-server:
    image: nwnxee/unified:build8193.37
    hostname: nwnee
    container_name: nwnee_baldur
    tty: true
    stdin_open: true
    stop_signal: SIGINT
    stop_grace_period: 2m
    entrypoint: /nwn/home/run-server.sh
    env_file:
        - ./config/nwserver.env
        - ./config/mysql.env
    environment:
      # Sustituye los bind-mount de /etc/timezone y /etc/localtime, que no
      # existen en un host Windows y rompian el arranque desde win_run_server.bat.
      - TZ=Europe/Madrid
    depends_on:
      mysql:
        condition: service_healthy
    ports:
    - '0.0.0.0:5121:5121/udp'
    volumes:
      - ./:/nwn/home
      - ./logs:/nwn/data/bin/linux-x86/logs.0
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"

  mysql:
    image: mysql:8.4
    hostname: mysql
    container_name: nwnee_baldur_mysql
    command: ["mysqld", "--mysql-native-password=ON"]
    env_file:
      - ./config/mysql.env
    environment:
      - TZ=Europe/Madrid
    volumes:
      - mysql_data:/var/lib/mysql
      - ./config/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # Metrics are opt-in. NWNX_METRICS_INFLUXDB_SKIP=y in config/nwserver.env, so
  # nothing writes to InfluxDB in normal operation, and the online host runs
  # neither service. Start both only for a measurement window:
  #   docker compose --profile metrics up -d
  influxdb:
    profiles: [metrics]
    hostname: influxdb
    image: influxdb:1.7
    restart: unless-stopped
    environment:
      - TZ=Europe/Madrid
    env_file: ./config/influxdb.env
    volumes:
    - influxdb:/var/lib/influxdb

  grafana:
    profiles: [metrics]
    hostname: grafana
    image: grafana/grafana:6.0.1
    restart: unless-stopped
    environment:
      - TZ=Europe/Madrid
    ports:
      - 3000:3000/tcp
    depends_on:
    - influxdb
    env_file: ./config/grafana.env
    volumes:
    - ./config/grafana-provisioning:/etc/grafana/provisioning
    - grafana:/var/lib/grafana
volumes:
  influxdb:
  grafana:
  mysql_data:
